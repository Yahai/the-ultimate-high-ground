name: Validate game
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check assets/game.js
      - name: Check game assets and orbital mechanics
        run: node tests/smoke.cjs
      - name: Exercise strategy model
        run: node tests/strategy.test.mjs
      - name: Verify shared orbital geometry and mission passes
        run: node tests/orbital.test.mjs
      - name: Verify tasking, downlinks, and intelligence products
        run: node tests/mission.test.mjs