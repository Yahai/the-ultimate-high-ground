name: Validate game
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check assets/game.js
          node --check assets/strategy.mjs
          node --check assets/orbital.mjs
          node --check assets/replay.mjs
      - name: Check game assets and orbital mechanics
        run: node tests/smoke.cjs
      - name: Exercise strategy model
        run: node tests/strategy.test.mjs
      - name: Verify shared orbital geometry and mission passes
        run: node tests/orbital.test.mjs
      - name: Verify tasking, downlinks, and intelligence products
        run: node tests/mission.test.mjs
      - name: Verify replay timing and scene geometry
        run: node tests/replay.test.mjs
  mobile-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mobile layout browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify phone landscape and portrait layouts
        run: python tests/mobile_layout.py
